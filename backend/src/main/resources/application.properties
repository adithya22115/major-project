spring.application.name=MediCycle
server.port=8085

# H2 for local development (switch to PostgreSQL for production)
spring.datasource.url=jdbc:h2:mem:medicycle;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL (uncomment for production)
# spring.datasource.url=jdbc:postgresql://localhost:5432/medicycle
# spring.datasource.username=postgres
# spring.datasource.password=postgres

jwt.secret=MediCycleSecretKeyForJWTTokenGenerationMustBeLongEnough2024
jwt.expiration=86400000

file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
